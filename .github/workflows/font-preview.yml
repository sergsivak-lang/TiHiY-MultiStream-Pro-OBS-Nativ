name: Render Star Citizen font previews

on:
  pull_request:
    branches: [master]
    paths:
      - font-preview-trigger.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl
          mkdir -p work/fonts output

      - name: Download exact fonts
        run: |
          curl -fL --retry 4 'https://github.com/google/fonts/raw/main/ofl/orbitron/Orbitron%5Bwght%5D.ttf' -o work/fonts/Orbitron.ttf
          curl -fL --retry 4 'https://github.com/google/fonts/raw/main/ofl/exo2/Exo2%5Bwght%5D.ttf' -o work/fonts/Exo2.ttf
          curl -fL --retry 4 'https://github.com/google/fonts/raw/main/ofl/tektur/Tektur%5Bwdth%2Cwght%5D.ttf' -o work/fonts/Tektur.ttf
          curl -fL --retry 4 'https://github.com/google/fonts/raw/main/ofl/unbounded/Unbounded%5Bwght%5D.ttf' -o work/fonts/Unbounded.ttf

      - name: Download Star Citizen moving source and make background
        run: |
          curl -fL --retry 5 --retry-delay 2 'https://media.robertsspaceindustries.com/9vuck22dgycnl/source.mp4' -o work/source.mp4
          ffmpeg -y -hide_banner -loglevel error -ss 00:00:10 -i work/source.mp4 -frames:v 1 -vf "scale=2560:1440:force_original_aspect_ratio=increase,crop=2560:1440" work/bg.jpg

      - name: Render four exact typography mockups
        shell: bash
        run: |
          set -euo pipefail
          cd work
          COMMON="drawbox=x=0:y=0:w=iw:h=ih:color=black@0.42:t=fill,drawbox=x=150:y=245:w=2260:h=790:color=black@0.30:t=fill,drawbox=x=150:y=245:w=10:h=790:color=0x72D7FF@0.95:t=fill,drawbox=x=150:y=245:w=2260:h=3:color=0x72D7FF@0.75:t=fill,drawbox=x=150:y=1032:w=2260:h=3:color=0x72D7FF@0.50:t=fill"
          LORE1="МИ НЕ СПОСТЕРІГАЄМО ЗА ВСЕСВІТОМ."
          LORE2="МИ ЗАЛИШАЄМО В НЬОМУ СВІЙ СЛІД."

          ffmpeg -y -hide_banner -loglevel error -loop 1 -i bg.jpg -frames:v 1 -vf "$COMMON,drawtext=fontfile=fonts/Orbitron.ttf:text='STAR CITIZEN':fontcolor=white:fontsize=108:borderw=2:bordercolor=black@0.8:shadowx=5:shadowy=5:shadowcolor=0x63D9FF@0.45:x=190:y=300,drawtext=fontfile=fonts/Tektur.ttf:text='$LORE1':fontcolor=white:fontsize=82:borderw=2:bordercolor=black@0.85:shadowx=4:shadowy=4:shadowcolor=0x63D9FF@0.40:x=190:y=545,drawtext=fontfile=fonts/Tektur.ttf:text='$LORE2':fontcolor=0xBFEFFF:fontsize=82:borderw=2:bordercolor=black@0.85:shadowx=4:shadowy=4:shadowcolor=0x63D9FF@0.50:x=190:y=690,drawtext=fontfile=fonts/Exo2.ttf:text='ВАРІАНТ 1  •  ORBITRON + TEKTUR':fontcolor=0xA9DDF5:fontsize=42:x=190:y=960" ../output/01_ORBITRON_TEKTUR.jpg

          ffmpeg -y -hide_banner -loglevel error -loop 1 -i bg.jpg -frames:v 1 -vf "$COMMON,drawtext=fontfile=fonts/Orbitron.ttf:text='STAR CITIZEN':fontcolor=white:fontsize=108:borderw=2:bordercolor=black@0.8:shadowx=5:shadowy=5:shadowcolor=0x63D9FF@0.45:x=190:y=300,drawtext=fontfile=fonts/Unbounded.ttf:text='$LORE1':fontcolor=white:fontsize=64:borderw=2:bordercolor=black@0.88:shadowx=4:shadowy=4:shadowcolor=0x63D9FF@0.38:x=190:y=545,drawtext=fontfile=fonts/Unbounded.ttf:text='$LORE2':fontcolor=0xC5F1FF:fontsize=64:borderw=2:bordercolor=black@0.88:shadowx=4:shadowy=4:shadowcolor=0x63D9FF@0.48:x=190:y=690,drawtext=fontfile=fonts/Exo2.ttf:text='ВАРІАНТ 2  •  ORBITRON + UNBOUNDED':fontcolor=0xA9DDF5:fontsize=42:x=190:y=960" ../output/02_ORBITRON_UNBOUNDED.jpg

          ffmpeg -y -hide_banner -loglevel error -loop 1 -i bg.jpg -frames:v 1 -vf "$COMMON,drawtext=fontfile=fonts/Orbitron.ttf:text='STAR CITIZEN':fontcolor=white:fontsize=108:borderw=2:bordercolor=black@0.8:shadowx=5:shadowy=5:shadowcolor=0x63D9FF@0.45:x=190:y=300,drawtext=fontfile=fonts/Exo2.ttf:text='$LORE1':fontcolor=white:fontsize=80:borderw=2:bordercolor=black@0.85:shadowx=4:shadowy=4:shadowcolor=0x63D9FF@0.38:x=190:y=545,drawtext=fontfile=fonts/Exo2.ttf:text='$LORE2':fontcolor=0xBFEFFF:fontsize=80:borderw=2:bordercolor=black@0.85:shadowx=4:shadowy=4:shadowcolor=0x63D9FF@0.48:x=190:y=690,drawtext=fontfile=fonts/Exo2.ttf:text='ВАРІАНТ 3  •  ORBITRON + EXO 2':fontcolor=0xA9DDF5:fontsize=42:x=190:y=960" ../output/03_ORBITRON_EXO2.jpg

          ffmpeg -y -hide_banner -loglevel error -loop 1 -i bg.jpg -frames:v 1 -vf "$COMMON,drawtext=fontfile=fonts/Orbitron.ttf:text='STAR CITIZEN':fontcolor=0xDFF7FF:fontsize=118:borderw=2:bordercolor=black@0.9:shadowx=6:shadowy=6:shadowcolor=0x63D9FF@0.55:x=190:y=300,drawtext=fontfile=fonts/Tektur.ttf:text='$LORE1':fontcolor=white:fontsize=74:borderw=2:bordercolor=black@0.85:shadowx=4:shadowy=4:shadowcolor=0x63D9FF@0.35:x=190:y=545,drawtext=fontfile=fonts/Unbounded.ttf:text='$LORE2':fontcolor=0x8EE9FF:fontsize=62:borderw=2:bordercolor=black@0.9:shadowx=5:shadowy=5:shadowcolor=0x63D9FF@0.58:x=190:y=700,drawtext=fontfile=fonts/Orbitron.ttf:text='TiHiY-DED':fontcolor=white:fontsize=72:borderw=2:bordercolor=black@0.9:shadowx=5:shadowy=5:shadowcolor=0x63D9FF@0.50:x=190:y=860,drawtext=fontfile=fonts/Exo2.ttf:text='ВАРІАНТ 4  •  ФІНАЛЬНА КОМБІНАЦІЯ':fontcolor=0xA9DDF5:fontsize=42:x=190:y=960" ../output/04_FINAL_COMBINATION.jpg

      - name: Upload previews
        uses: actions/upload-artifact@v4
        with:
          name: TiHiY-Star-Citizen-Font-Previews
          path: output/*.jpg
          compression-level: 0
          retention-days: 7
