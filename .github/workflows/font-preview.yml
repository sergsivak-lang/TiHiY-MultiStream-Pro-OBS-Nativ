name: Render Star Citizen font previews

on:
  pull_request:
    branches: [master]
    paths:
      - font-preview-trigger.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl
          mkdir -p work/fonts output

      - name: Download exact fonts
        run: |
          curl -fL --retry 4 'https://github.com/google/fonts/raw/main/ofl/orbitron/Orbitron%5Bwght%5D.ttf' -o work/fonts/Orbitron.ttf
          curl -fL --retry 4 'https://github.com/google/fonts/raw/main/ofl/exo2/Exo2%5Bwght%5D.ttf' -o work/fonts/Exo2.ttf
          curl -fL --retry 4 'https://github.com/google/fonts/raw/main/ofl/tektur/Tektur%5Bwdth%2Cwght%5D.ttf' -o work/fonts/Tektur.ttf
          curl -fL --retry 4 'https://github.com/google/fonts/raw/main/ofl/unbounded/Unbounded%5Bwght%5D.ttf' -o work/fonts/Unbounded.ttf

      - name: Create Star Citizen style HUD background
        run: |
          ffmpeg -y -hide_banner -loglevel error -f lavfi -i "color=c=0x05101c:s=2560x1440:d=1" -frames:v 1 -vf "noise=alls=10:allf=t+u,vignette=PI/4,drawgrid=width=160:height=160:thickness=1:color=0x1c7299@0.18,drawbox=x=0:y=0:w=2560:h=180:color=0x02070d@0.75:t=fill,drawbox=x=0:y=1260:w=2560:h=180:color=0x02070d@0.75:t=fill,drawbox=x=130:y=210:w=2300:h=900:color=0x071b2c@0.62:t=fill,drawbox=x=130:y=210:w=12:h=900:color=0x62d9ff@0.95:t=fill,drawbox=x=130:y=210:w=2300:h=3:color=0x62d9ff@0.70:t=fill,drawbox=x=130:y=1107:w=2300:h=3:color=0x62d9ff@0.45:t=fill" work/bg.jpg

      - name: Render four exact typography mockups
        shell: bash
        run: |
          set -euo pipefail
          cd work
          LORE1="МИ НЕ СПОСТЕРІГАЄМО ЗА ВСЕСВІТОМ."
          LORE2="МИ ЗАЛИШАЄМО В НЬОМУ СВІЙ СЛІД."

          ffmpeg -y -hide_banner -loglevel error -loop 1 -i bg.jpg -frames:v 1 -vf "drawtext=fontfile=fonts/Orbitron.ttf:text='STAR CITIZEN':fontcolor=white:fontsize=108:borderw=2:bordercolor=black@0.8:shadowx=5:shadowy=5:shadowcolor=0x63D9FF@0.45:x=190:y=285,drawtext=fontfile=fonts/Tektur.ttf:text='$LORE1':fontcolor=white:fontsize=82:borderw=2:bordercolor=black@0.85:shadowx=4:shadowy=4:shadowcolor=0x63D9FF@0.40:x=190:y=530,drawtext=fontfile=fonts/Tektur.ttf:text='$LORE2':fontcolor=0xBFEFFF:fontsize=82:borderw=2:bordercolor=black@0.85:shadowx=4:shadowy=4:shadowcolor=0x63D9FF@0.50:x=190:y=680,drawtext=fontfile=fonts/Exo2.ttf:text='ВАРІАНТ 1  •  ORBITRON + TEKTUR':fontcolor=0xA9DDF5:fontsize=42:x=190:y=1010" ../output/01_ORBITRON_TEKTUR.jpg

          ffmpeg -y -hide_banner -loglevel error -loop 1 -i bg.jpg -frames:v 1 -vf "drawtext=fontfile=fonts/Orbitron.ttf:text='STAR CITIZEN':fontcolor=white:fontsize=108:borderw=2:bordercolor=black@0.8:shadowx=5:shadowy=5:shadowcolor=0x63D9FF@0.45:x=190:y=285,drawtext=fontfile=fonts/Unbounded.ttf:text='$LORE1':fontcolor=white:fontsize=64:borderw=2:bordercolor=black@0.88:shadowx=4:shadowy=4:shadowcolor=0x63D9FF@0.38:x=190:y=530,drawtext=fontfile=fonts/Unbounded.ttf:text='$LORE2':fontcolor=0xC5F1FF:fontsize=64:borderw=2:bordercolor=black@0.88:shadowx=4:shadowy=4:shadowcolor=0x63D9FF@0.48:x=190:y=680,drawtext=fontfile=fonts/Exo2.ttf:text='ВАРІАНТ 2  •  ORBITRON + UNBOUNDED':fontcolor=0xA9DDF5:fontsize=42:x=190:y=1010" ../output/02_ORBITRON_UNBOUNDED.jpg

          ffmpeg -y -hide_banner -loglevel error -loop 1 -i bg.jpg -frames:v 1 -vf "drawtext=fontfile=fonts/Orbitron.ttf:text='STAR CITIZEN':fontcolor=white:fontsize=108:borderw=2:bordercolor=black@0.8:shadowx=5:shadowy=5:shadowcolor=0x63D9FF@0.45:x=190:y=285,drawtext=fontfile=fonts/Exo2.ttf:text='$LORE1':fontcolor=white:fontsize=80:borderw=2:bordercolor=black@0.85:shadowx=4:shadowy=4:shadowcolor=0x63D9FF@0.38:x=190:y=530,drawtext=fontfile=fonts/Exo2.ttf:text='$LORE2':fontcolor=0xBFEFFF:fontsize=80:borderw=2:bordercolor=black@0.85:shadowx=4:shadowy=4:shadowcolor=0x63D9FF@0.48:x=190:y=680,drawtext=fontfile=fonts/Exo2.ttf:text='ВАРІАНТ 3  •  ORBITRON + EXO 2':fontcolor=0xA9DDF5:fontsize=42:x=190:y=1010" ../output/03_ORBITRON_EXO2.jpg

          ffmpeg -y -hide_banner -loglevel error -loop 1 -i bg.jpg -frames:v 1 -vf "drawtext=fontfile=fonts/Orbitron.ttf:text='STAR CITIZEN':fontcolor=0xDFF7FF:fontsize=118:borderw=2:bordercolor=black@0.9:shadowx=6:shadowy=6:shadowcolor=0x63D9FF@0.55:x=190:y=285,drawtext=fontfile=fonts/Tektur.ttf:text='$LORE1':fontcolor=white:fontsize=74:borderw=2:bordercolor=black@0.85:shadowx=4:shadowy=4:shadowcolor=0x63D9FF@0.35:x=190:y=515,drawtext=fontfile=fonts/Unbounded.ttf:text='$LORE2':fontcolor=0x8EE9FF:fontsize=62:borderw=2:bordercolor=black@0.9:shadowx=5:shadowy=5:shadowcolor=0x63D9FF@0.58:x=190:y=675,drawtext=fontfile=fonts/Orbitron.ttf:text='TiHiY-DED':fontcolor=white:fontsize=72:borderw=2:bordercolor=black@0.9:shadowx=5:shadowy=5:shadowcolor=0x63D9FF@0.50:x=190:y=850,drawtext=fontfile=fonts/Exo2.ttf:text='ВАРІАНТ 4  •  ФІНАЛЬНА КОМБІНАЦІЯ':fontcolor=0xA9DDF5:fontsize=42:x=190:y=1010" ../output/04_FINAL_COMBINATION.jpg

      - name: Upload previews
        uses: actions/upload-artifact@v4
        with:
          name: TiHiY-Star-Citizen-Font-Previews
          path: output/*.jpg
          compression-level: 0
          retention-days: 7
