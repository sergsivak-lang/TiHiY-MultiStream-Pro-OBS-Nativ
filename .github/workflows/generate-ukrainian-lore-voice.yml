name: Generate Ukrainian Lore Voice

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  voice:
    if: contains(github.event.pull_request.title, '[VOICE]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install edge-tts
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          mkdir -p voice/raw voice/processed

      - name: Generate Ukrainian male narration
        shell: bash
        run: |
          cat > voice/lines.tsv <<'EOF'
1	У дві тисячі дев'ятсот п'ятдесят шостому році людство вже не дивиться на зорі знизу. Воно живе серед них. Кожна система тут приховує нові світи, нові маршрути і нові небезпеки.
2	Цей всесвіт створюють кораблі. Робертс Спейс Індастріз. Енвіл Аероспейс. Ейджіс Дайнемікс. Дрейк Інтерпленетарі. Міск. Оріджин Джампворкс. Крусейдер Індастріз. Арго. Консолідейтед Аутленд. І навіть екзотичні кораблі Гатак.
3	Та не всі шукають слави у вогні. Хтось добуває руду серед холодних астероїдів. Хтось ріже мертві корпуси на метал. Майнінг і сальважинг годують цілі станції та перетворюють уламки на нове життя.
4	Контракти ведуть у покинуті комплекси, на далекі планети і в темні коридори кораблів. Тут кожні двері можуть бути пасткою, а кожен сигнал — початком нової історії.
5	Але чим далі ти йдеш, тим менше залишається безпечних маршрутів. Небо наповнюється слідами двигунів. Радари ловлять чужі цілі. І тиша перед боєм стає голоснішою за сирени.
6	Коли переговори закінчуються, говорять гармати. Пілот виживає не завдяки броні. Він виживає завдяки досвіду, холодній голові і рішенню, прийнятому за частку секунди.
7	Ми не спостерігаємо за всесвітом.
8	Ми залишаємо в ньому свій слід.
EOF
          while IFS=$'\t' read -r N TEXT; do
            edge-tts --voice uk-UA-OstapNeural --rate='-15%' --pitch='-8Hz' --text "$TEXT" --write-media "voice/raw/line${N}.mp3"
            ffmpeg -y -hide_banner -loglevel error -i "voice/raw/line${N}.mp3" \
              -af "asetrate=24000*0.94,aresample=48000,atempo=1.03,highpass=f=60,bass=g=7:f=105,treble=g=-2:f=2800,acompressor=threshold=-20dB:ratio=3.2:attack=15:release=220,aecho=0.8:0.35:28:0.06,alimiter=limit=0.93" \
              "voice/processed/line${N}.wav"
          done < voice/lines.tsv

      - name: Build master voice timeline
        shell: bash
        run: |
          ffmpeg -y -hide_banner -loglevel error \
            -i voice/processed/line1.wav \
            -i voice/processed/line2.wav \
            -i voice/processed/line3.wav \
            -i voice/processed/line4.wav \
            -i voice/processed/line5.wav \
            -i voice/processed/line6.wav \
            -i voice/processed/line7.wav \
            -i voice/processed/line8.wav \
            -filter_complex "[0:a]adelay=800|800[v0];[1:a]adelay=18000|18000[v1];[2:a]adelay=37000|37000[v2];[3:a]adelay=59000|59000[v3];[4:a]adelay=80000|80000[v4];[5:a]adelay=98000|98000[v5];[6:a]adelay=123000|123000[v6];[7:a]adelay=126000|126000[v7];[v0][v1][v2][v3][v4][v5][v6][v7]amix=inputs=8:normalize=0,alimiter=limit=0.95[a]" \
            -map '[a]' -t 131 voice/ukrainian_lore_voice_timeline.wav
          ffprobe -v error -show_entries format=duration,size -of json voice/ukrainian_lore_voice_timeline.wav > voice/voice_info.json

      - name: Upload narration
        uses: actions/upload-artifact@v4
        with:
          name: TiHiY-Ukrainian-Lore-Voice
          path: voice/**
          compression-level: 0
          retention-days: 7
