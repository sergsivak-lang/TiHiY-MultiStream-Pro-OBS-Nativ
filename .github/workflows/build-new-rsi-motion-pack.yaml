name: Build New RSI Motion Pack

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.title, '[MOTIONPACK]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl python3 ffmpeg
          mkdir -p output/videos output/sheets output/meta

      - name: Download verified new official RSI motion sources
        shell: bash
        run: |
          set -euo pipefail
          BASHER_URL='https://media.robertsspaceindustries.com/mhnviqz32lc2i/source.mp4'
          TYILUI_URL='https://media.robertsspaceindustries.com/pahuti3et7hie/source.mp4'

          printf '%s\n' "$BASHER_URL" > output/meta/basher_source_url.txt
          printf '%s\n' "$TYILUI_URL" > output/meta/tyilui_source_url.txt

          curl -fL --retry 8 --retry-delay 2 --connect-timeout 20 -A 'Mozilla/5.0' "$BASHER_URL" -o output/videos/basher.mp4
          curl -fL --retry 8 --retry-delay 2 --connect-timeout 20 -A 'Mozilla/5.0' "$TYILUI_URL" -o output/videos/tyilui.mp4

          for F in output/videos/*.mp4; do
            B=$(basename "$F" .mp4)
            ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,r_frame_rate -show_entries format=duration,size -of json "$F" > "output/meta/${B}_info.json"
            ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=nw=1:nk=1 "$F" | grep -q .
          done
          find output/videos -type f -printf '%f %s bytes\n' | sort

      - name: Make visual contact sheets
        shell: bash
        run: |
          set -euo pipefail
          FONT='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          for F in output/videos/*.mp4; do
            B=$(basename "$F" .mp4)
            DUR=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$F")
            INTERVAL=$(python3 - <<PY
          d=float('$DUR')
          print(max(d/12.0,0.5))
          PY
          )
            ffmpeg -y -hide_banner -loglevel error -i "$F" \
              -vf "fps=1/${INTERVAL},scale=480:-2,drawtext=fontfile=${FONT}:text='%{pts\\:hms}':x=8:y=8:fontsize=20:fontcolor=white:borderw=2:bordercolor=black,tile=4x3:padding=4:margin=4" \
              -frames:v 1 -q:v 2 "output/sheets/${B}_sheet.jpg"
          done

      - name: Upload verified new RSI motion pack
        uses: actions/upload-artifact@v4
        with:
          name: TiHiY-New-RSI-Motion-Pack
          path: output/**
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  generate-ukrainian-voice:
    if: ${{ contains(github.event.pull_request.title, '[VOICE-DIRECT]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Install neural voice and audio tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install edge-tts
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          mkdir -p voice/raw voice/processed

      - name: Generate Ukrainian male narration
        shell: bash
        run: |
          cat > voice/lines.tsv <<'EOF'
          1	У дві тисячі дев'ятсот п'ятдесят шостому році людство вже не дивиться на зорі знизу. Воно живе серед них. Кожна система тут приховує нові світи, нові маршрути і нові небезпеки.
          2	Цей всесвіт створюють кораблі. Робертс Спейс Індастріз. Енвіл Аероспейс. Ейджіс Дайнемікс. Дрейк Інтерпленетарі. Міск. Оріджин Джампворкс. Крусейдер Індастріз. Арго. Консолідейтед Аутленд. І навіть екзотичні кораблі Гатак.
          3	Та не всі шукають слави у вогні. Хтось добуває руду серед холодних астероїдів. Хтось ріже мертві корпуси на метал. Майнінг і сальважинг годують цілі станції та перетворюють уламки на нове життя.
          4	Контракти ведуть у покинуті комплекси, на далекі планети і в темні коридори кораблів. Тут кожні двері можуть бути пасткою, а кожен сигнал — початком нової історії.
          5	Але чим далі ти йдеш, тим менше залишається безпечних маршрутів. Небо наповнюється слідами двигунів. Радари ловлять чужі цілі. І тиша перед боєм стає голоснішою за сирени.
          6	Коли переговори закінчуються, говорять гармати. Пілот виживає не завдяки броні. Він виживає завдяки досвіду, холодній голові і рішенню, прийнятому за частку секунди.
          7	Ми не спостерігаємо за всесвітом.
          8	Ми залишаємо в ньому свій слід.
          EOF
          sed -i 's/^          //' voice/lines.tsv
          while IFS=$'\t' read -r N TEXT; do
            edge-tts --voice uk-UA-OstapNeural --rate='-17%' --pitch='-10Hz' --text "$TEXT" --write-media "voice/raw/line${N}.mp3"
            ffmpeg -y -hide_banner -loglevel error -i "voice/raw/line${N}.mp3" \
              -af "asetrate=24000*0.93,aresample=48000,atempo=1.02,highpass=f=55,bass=g=8:f=100,treble=g=-2.5:f=2800,acompressor=threshold=-21dB:ratio=3.5:attack=18:release=240,aecho=0.8:0.32:26:0.05,alimiter=limit=0.94" \
              "voice/processed/line${N}.wav"
          done < voice/lines.tsv

      - name: Build narration timeline
        shell: bash
        run: |
          ffmpeg -y -hide_banner -loglevel error \
            -i voice/processed/line1.wav -i voice/processed/line2.wav \
            -i voice/processed/line3.wav -i voice/processed/line4.wav \
            -i voice/processed/line5.wav -i voice/processed/line6.wav \
            -i voice/processed/line7.wav -i voice/processed/line8.wav \
            -filter_complex "[0:a]adelay=800|800[v0];[1:a]adelay=18000|18000[v1];[2:a]adelay=37000|37000[v2];[3:a]adelay=59000|59000[v3];[4:a]adelay=80000|80000[v4];[5:a]adelay=98000|98000[v5];[6:a]adelay=122800|122800[v6];[7:a]adelay=126000|126000[v7];[v0][v1][v2][v3][v4][v5][v6][v7]amix=inputs=8:normalize=0,alimiter=limit=0.95[a]" \
            -map '[a]' -t 130.7 voice/ukrainian_lore_voice_timeline.wav
          ffprobe -v error -show_entries format=duration,size -of json voice/ukrainian_lore_voice_timeline.wav > voice/voice_info.json

      - name: Upload Ukrainian narration
        uses: actions/upload-artifact@v4
        with:
          name: TiHiY-Ukrainian-Lore-Voice-Direct
          path: voice/**
          compression-level: 0
          retention-days: 7

      - name: Report voice artifact run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 8
          gh issue create --title "UKRAINIAN VOICE DIRECT RUN ${{ github.run_id }}" --body "Voice artifact completed. Run ID: ${{ github.run_id }}. Artifact: TiHiY-Ukrainian-Lore-Voice-Direct."
