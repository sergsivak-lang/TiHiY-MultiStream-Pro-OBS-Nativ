name: Build New RSI Motion Pack

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.title, '[MOTIONPACK]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl python3 ffmpeg
          mkdir -p output/videos output/sheets output/meta

      - name: Download verified new official RSI motion sources
        shell: bash
        run: |
          set -euo pipefail
          BASHER_URL='https://media.robertsspaceindustries.com/mhnviqz32lc2i/source.mp4'
          TYILUI_URL='https://media.robertsspaceindustries.com/pahuti3et7hie/source.mp4'

          printf '%s\n' "$BASHER_URL" > output/meta/basher_source_url.txt
          printf '%s\n' "$TYILUI_URL" > output/meta/tyilui_source_url.txt

          curl -fL --retry 8 --retry-delay 2 --connect-timeout 20 -A 'Mozilla/5.0' "$BASHER_URL" -o output/videos/basher.mp4
          curl -fL --retry 8 --retry-delay 2 --connect-timeout 20 -A 'Mozilla/5.0' "$TYILUI_URL" -o output/videos/tyilui.mp4

          for F in output/videos/*.mp4; do
            B=$(basename "$F" .mp4)
            ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,r_frame_rate -show_entries format=duration,size -of json "$F" > "output/meta/${B}_info.json"
            ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=nw=1:nk=1 "$F" | grep -q .
          done
          find output/videos -type f -printf '%f %s bytes\n' | sort

      - name: Make visual contact sheets
        shell: bash
        run: |
          set -euo pipefail
          FONT='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          for F in output/videos/*.mp4; do
            B=$(basename "$F" .mp4)
            DUR=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$F")
            INTERVAL=$(python3 - <<PY
          d=float('$DUR')
          print(max(d/12.0,0.5))
          PY
          )
            ffmpeg -y -hide_banner -loglevel error -i "$F" \
              -vf "fps=1/${INTERVAL},scale=480:-2,drawtext=fontfile=${FONT}:text='%{pts\\:hms}':x=8:y=8:fontsize=20:fontcolor=white:borderw=2:bordercolor=black,tile=4x3:padding=4:margin=4" \
              -frames:v 1 -q:v 2 "output/sheets/${B}_sheet.jpg"
          done

      - name: Upload verified new RSI motion pack
        uses: actions/upload-artifact@v4
        with:
          name: TiHiY-New-RSI-Motion-Pack
          path: output/**
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
