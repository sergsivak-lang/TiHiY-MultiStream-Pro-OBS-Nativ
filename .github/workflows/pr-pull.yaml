name: Pull Request
run-name: ${{ github.event.pull_request.title }} pull request run 🚀
on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - '**.md'
    branches: [master, main]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true
jobs:
  check-format:
    name: Check Formatting 🔍
    uses: ./.github/workflows/check-format.yaml
    permissions:
      contents: read

  build-project:
    name: Build Project 🧱
    uses: ./.github/workflows/build-project.yaml
    secrets: inherit
    permissions:
      contents: read

  render-star-citizen-promo:
    name: Render real Star Citizen promo 🎬
    if: ${{ contains(github.event.pull_request.title, '[PROMO]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Install tools and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl gawk
          mkdir -p work/fonts output
          curl -fL --retry 4 --retry-delay 2 'https://github.com/google/fonts/raw/main/ofl/orbitron/Orbitron%5Bwght%5D.ttf' -o work/fonts/Orbitron.ttf
          curl -fL --retry 4 --retry-delay 2 'https://github.com/google/fonts/raw/main/ofl/exo2/Exo2%5Bwght%5D.ttf' -o work/fonts/Exo2.ttf

      - name: Download official moving RSI video
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 3 'https://media.robertsspaceindustries.com/4tsoif8ccdaiq/source.mp4' -o work/source.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=nw=1:nk=1 work/source.mp4 | grep -q .
          ffprobe -v error -show_entries format=duration,size -of json work/source.mp4

      - name: Cut six real moving scenes
        shell: bash
        run: |
          set -euo pipefail
          cd work
          DUR=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 source.mp4)
          for SPEC in '0 0.02' '1 0.18' '2 0.35' '3 0.52' '4 0.69' '5 0.84'; do
            read -r N F <<< "$SPEC"
            START=$(awk -v d="$DUR" -v f="$F" 'BEGIN{s=d*f; if(s+5.0>d)s=d-5.0; if(s<0)s=0; printf "%.3f",s}')
            echo "Creating moving clip $N at $START seconds"
            ffmpeg -y -hide_banner -loglevel error -ss "$START" -i source.mp4 -t 4.9 -vf "scale=2560:1440:force_original_aspect_ratio=increase,crop=2560:1440,fps=60,eq=contrast=1.08:saturation=1.13:brightness=-0.01:gamma=0.98,unsharp=5:5:0.42,trim=duration=4.6,setpts=PTS-STARTPTS" -an -c:v libx264 -preset medium -crf 17 -profile:v high -pix_fmt yuv420p "clip${N}.mp4"
          done

      - name: Render cinematic transitions branding and sound
        shell: bash
        run: |
          set -euo pipefail
          cd work
          FILTER="[0:v][1:v]xfade=transition=smoothleft:duration=0.45:offset=4.15[v1];[v1][2:v]xfade=transition=zoomin:duration=0.45:offset=8.30[v2];[v2][3:v]xfade=transition=radial:duration=0.45:offset=12.45[v3];[v3][4:v]xfade=transition=smoothup:duration=0.45:offset=16.60[v4];[v4][5:v]xfade=transition=fadeblack:duration=0.45:offset=20.75[vbase];[vbase]vignette=PI/6,drawtext=fontfile=fonts/Orbitron.ttf:text='STAR CITIZEN':fontcolor=white:fontsize=148:borderw=4:bordercolor=black@0.88:shadowx=8:shadowy=8:shadowcolor=black@0.80:x=(w-text_w)/2:y=h*0.42:enable='between(t,0.35,3.80)',drawtext=fontfile=fonts/Exo2.ttf:text='TiHiY-DED':fontcolor=white:fontsize=132:borderw=4:bordercolor=black@0.90:shadowx=8:shadowy=8:shadowcolor=black@0.82:x=(w-text_w)/2:y=h*0.44:enable='between(t,21.65,25.15)',fade=t=in:st=0:d=0.20,fade=t=out:st=24.85:d=0.45[vout];[6:a]volume=0.24,tremolo=f=0.18:d=0.72,aecho=0.8:0.55:90|180:0.25|0.12[drone];[7:a]highpass=f=35,lowpass=f=850,volume=0.17[noise];[drone][noise]amix=inputs=2:duration=first:normalize=0,afade=t=in:st=0:d=0.8,afade=t=out:st=24.4:d=0.9,alimiter=limit=0.94,pan=stereo|c0=c0|c1=c0[aout]"
          ffmpeg -y -hide_banner -loglevel error -i clip0.mp4 -i clip1.mp4 -i clip2.mp4 -i clip3.mp4 -i clip4.mp4 -i clip5.mp4 -f lavfi -i 'sine=frequency=55:sample_rate=48000:duration=25.35' -f lavfi -i 'anoisesrc=color=pink:sample_rate=48000:duration=25.35:amplitude=0.08' -filter_complex "$FILTER" -map '[vout]' -map '[aout]' -c:v libx264 -preset slow -crf 16 -profile:v high -level 5.2 -pix_fmt yuv420p -c:a aac -b:a 320k -ar 48000 -ac 2 -movflags +faststart ../output/TiHiY_STAR_CITIZEN_FULL_MOTION_PROMO_2K_60FPS.mp4
          ffmpeg -y -hide_banner -loglevel error -i ../output/TiHiY_STAR_CITIZEN_FULL_MOTION_PROMO_2K_60FPS.mp4 -vf 'scale=1920:1080:flags=lanczos' -c:v libx264 -preset medium -crf 19 -profile:v high -pix_fmt yuv420p -c:a copy -movflags +faststart ../output/TiHiY_STAR_CITIZEN_FULL_MOTION_PROMO_1080p_60FPS.mp4
          ffmpeg -y -hide_banner -loglevel error -ss 1.0 -i ../output/TiHiY_STAR_CITIZEN_FULL_MOTION_PROMO_2K_60FPS.mp4 -frames:v 1 ../output/PREVIEW_START.jpg
          ffmpeg -y -hide_banner -loglevel error -ss 12.5 -i ../output/TiHiY_STAR_CITIZEN_FULL_MOTION_PROMO_2K_60FPS.mp4 -frames:v 1 ../output/PREVIEW_MIDDLE.jpg
          ffmpeg -y -hide_banner -loglevel error -ss 23.0 -i ../output/TiHiY_STAR_CITIZEN_FULL_MOTION_PROMO_2K_60FPS.mp4 -frames:v 1 ../output/PREVIEW_END.jpg
          ffprobe -v error -show_entries format=duration,size:stream=codec_name,width,height,r_frame_rate -of json ../output/TiHiY_STAR_CITIZEN_FULL_MOTION_PROMO_2K_60FPS.mp4

      - name: Upload finished full-motion promo
        uses: actions/upload-artifact@v4
        with:
          name: TiHiY-Star-Citizen-Full-Motion-Promo
          path: output/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
