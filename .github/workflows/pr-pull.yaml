name: Pull Request
run-name: ${{ github.event.pull_request.title }} pull request run 🚀
on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - '**.md'
    branches: [master, main]
    types: [ opened, synchronize, reopened ]
permissions:
  contents: read
concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true
jobs:
  check-format:
    name: Check Formatting 🔍
    uses: ./.github/workflows/check-format.yaml
    permissions:
      contents: read

  build-project:
    name: Build Project 🧱
    uses: ./.github/workflows/build-project.yaml
    secrets: inherit
    permissions:
      contents: read

  render-star-citizen-promo:
    name: Render real Star Citizen promo 🎬
    if: contains(github.event.pull_request.title, '[PROMO]')
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Install video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl python3
          mkdir -p work/fonts output
          curl -fL --retry 4 --retry-delay 2 \
            'https://github.com/google/fonts/raw/main/ofl/orbitron/Orbitron%5Bwght%5D.ttf' \
            -o work/fonts/Orbitron.ttf
          curl -fL --retry 4 --retry-delay 2 \
            'https://github.com/google/fonts/raw/main/ofl/exo2/Exo2%5Bwght%5D.ttf' \
            -o work/fonts/Exo2.ttf

      - name: Download official moving RSI footage
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 3 \
            'https://media.robertsspaceindustries.com/4tsoif8ccdaiq/source.mp4' \
            -o work/source_a.mp4
          if ! curl -fL --retry 4 --retry-delay 3 \
            'https://media.robertsspaceindustries.com/2q1mo9uspa6ij/source.mp4' \
            -o work/source_b.mp4; then
            cp work/source_a.mp4 work/source_b.mp4
          fi
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name \
            -of default=nw=1:nk=1 work/source_a.mp4 | grep -q .
          if ! ffprobe -v error -select_streams v:0 -show_entries stream=codec_name \
            -of default=nw=1:nk=1 work/source_b.mp4 | grep -q .; then
            cp work/source_a.mp4 work/source_b.mp4
          fi
          ffprobe -v error -show_entries format=duration,size -of json work/source_a.mp4
          ffprobe -v error -show_entries format=duration,size -of json work/source_b.mp4

      - name: Cut seven real moving scenes
        shell: bash
        run: |
          set -euo pipefail
          cd work

          duration() {
            ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$1"
          }

          safe_start() {
            python3 - "$1" "$2" <<'PY'
import sys
length=float(sys.argv[1]); fraction=float(sys.argv[2]); clip=4.9
start=max(0.0,length*fraction)
if start+clip>length:
    start=max(0.0,length-clip-0.1)
print(f'{start:.3f}')
PY
          }

          make_clip() {
            local src="$1" frac="$2" out="$3"
            local dur start audio
            dur="$(duration "$src")"
            start="$(safe_start "$dur" "$frac")"
            audio="$(ffprobe -v error -select_streams a:0 -show_entries stream=index -of csv=p=0 "$src" || true)"
            echo "$out from $src at $start sec"

            if [[ -n "$audio" ]]; then
              ffmpeg -y -hide_banner -loglevel error -ss "$start" -i "$src" -t 4.8 \
                -filter_complex "[0:v]scale=2560:1440:force_original_aspect_ratio=increase,crop=2560:1440,fps=60,eq=contrast=1.08:saturation=1.13:brightness=-0.01:gamma=0.98,unsharp=5:5:0.42,trim=duration=4.5,setpts=PTS-STARTPTS[v];[0:a]atrim=duration=4.5,asetpts=PTS-STARTPTS,highpass=f=35,lowpass=f=17500,loudnorm=I=-15:LRA=9:TP=-1.5[a]" \
                -map '[v]' -map '[a]' -c:v libx264 -preset medium -crf 17 -profile:v high -pix_fmt yuv420p \
                -c:a aac -b:a 256k -ar 48000 -ac 2 "$out"
            else
              ffmpeg -y -hide_banner -loglevel error -ss "$start" -i "$src" \
                -f lavfi -i 'anullsrc=channel_layout=stereo:sample_rate=48000' -t 4.5 \
                -filter_complex "[0:v]scale=2560:1440:force_original_aspect_ratio=increase,crop=2560:1440,fps=60,eq=contrast=1.08:saturation=1.13:brightness=-0.01:gamma=0.98,unsharp=5:5:0.42,trim=duration=4.5,setpts=PTS-STARTPTS[v]" \
                -map '[v]' -map '1:a:0' -c:v libx264 -preset medium -crf 17 -profile:v high -pix_fmt yuv420p \
                -c:a aac -b:a 256k -ar 48000 -ac 2 -shortest "$out"
            fi
          }

          make_clip source_a.mp4 0.02 clip0.mp4
          make_clip source_b.mp4 0.12 clip1.mp4
          make_clip source_a.mp4 0.27 clip2.mp4
          make_clip source_b.mp4 0.39 clip3.mp4
          make_clip source_a.mp4 0.54 clip4.mp4
          make_clip source_b.mp4 0.69 clip5.mp4
          make_clip source_a.mp4 0.84 clip6.mp4

      - name: Render cinematic full-motion promo
        shell: bash
        run: |
          set -euo pipefail
          cd work
          cat > effects.txt <<'EOF'
[0:v][1:v]xfade=transition=smoothleft:duration=0.45:offset=4.05[v1];
[v1][2:v]xfade=transition=zoomin:duration=0.45:offset=8.10[v2];
[v2][3:v]xfade=transition=radial:duration=0.45:offset=12.15[v3];
[v3][4:v]xfade=transition=smoothup:duration=0.45:offset=16.20[v4];
[v4][5:v]xfade=transition=circleopen:duration=0.45:offset=20.25[v5];
[v5][6:v]xfade=transition=fadeblack:duration=0.45:offset=24.30[vbase];
[0:a][1:a]acrossfade=d=0.45:c1=tri:c2=tri[a1];
[a1][2:a]acrossfade=d=0.45:c1=tri:c2=tri[a2];
[a2][3:a]acrossfade=d=0.45:c1=tri:c2=tri[a3];
[a3][4:a]acrossfade=d=0.45:c1=tri:c2=tri[a4];
[a4][5:a]acrossfade=d=0.45:c1=tri:c2=tri[a5];
[a5][6:a]acrossfade=d=0.45:c1=tri:c2=tri[abase];
[vbase]vignette=PI/6,
 drawtext=fontfile='fonts/Orbitron.ttf':text='STAR CITIZEN':fontcolor=white:fontsize=148:borderw=4:bordercolor=black@0.88:shadowx=8:shadowy=8:shadowcolor=black@0.80:x=(w-text_w)/2:y=h*0.42:enable='between(t,0.35,3.80)':alpha='if(lt(t,0.90),(t-0.35)/0.55,if(lt(t,3.05),1,(3.80-t)/0.75))',
 drawtext=fontfile='fonts/Exo2.ttf':text='TiHiY-DED':fontcolor=white:fontsize=132:borderw=4:bordercolor=black@0.90:shadowx=8:shadowy=8:shadowcolor=black@0.82:x=(w-text_w)/2:y=h*0.44:enable='between(t,25.10,28.35)':alpha='if(lt(t,25.70),(t-25.10)/0.60,if(lt(t,27.65),1,(28.35-t)/0.70))',
 fade=t=in:st=0:d=0.20,fade=t=out:st=28.00:d=0.45[vout];
[abase]afade=t=in:st=0:d=0.25,afade=t=out:st=27.75:d=0.70,alimiter=limit=0.95[aout]
EOF

          ffmpeg -y -hide_banner -loglevel error \
            -i clip0.mp4 -i clip1.mp4 -i clip2.mp4 -i clip3.mp4 -i clip4.mp4 -i clip5.mp4 -i clip6.mp4 \
            -filter_complex_script effects.txt -map '[vout]' -map '[aout]' \
            -c:v libx264 -preset slow -crf 16 -profile:v high -level 5.2 -pix_fmt yuv420p \
            -c:a aac -b:a 320k -ar 48000 -ac 2 -movflags +faststart \
            ../output/TiHiY_STAR_CITIZEN_FULL_MOTION_PROMO_2K_60FPS.mp4

          ffmpeg -y -hide_banner -loglevel error \
            -i ../output/TiHiY_STAR_CITIZEN_FULL_MOTION_PROMO_2K_60FPS.mp4 \
            -vf 'scale=1920:1080:flags=lanczos' \
            -c:v libx264 -preset medium -crf 19 -profile:v high -pix_fmt yuv420p \
            -c:a copy -movflags +faststart \
            ../output/TiHiY_STAR_CITIZEN_FULL_MOTION_PROMO_1080p_60FPS.mp4

          ffmpeg -y -hide_banner -loglevel error -ss 1.0 \
            -i ../output/TiHiY_STAR_CITIZEN_FULL_MOTION_PROMO_2K_60FPS.mp4 \
            -frames:v 1 ../output/PREVIEW_START.jpg
          ffmpeg -y -hide_banner -loglevel error -ss 14.0 \
            -i ../output/TiHiY_STAR_CITIZEN_FULL_MOTION_PROMO_2K_60FPS.mp4 \
            -frames:v 1 ../output/PREVIEW_MIDDLE.jpg
          ffmpeg -y -hide_banner -loglevel error -ss 26.5 \
            -i ../output/TiHiY_STAR_CITIZEN_FULL_MOTION_PROMO_2K_60FPS.mp4 \
            -frames:v 1 ../output/PREVIEW_END.jpg

          ffprobe -v error -show_entries format=duration,size:stream=codec_name,width,height,r_frame_rate \
            -of json ../output/TiHiY_STAR_CITIZEN_FULL_MOTION_PROMO_2K_60FPS.mp4

      - name: Upload finished full-motion promo
        uses: actions/upload-artifact@v4
        with:
          name: TiHiY-Star-Citizen-Full-Motion-Promo
          path: output/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
