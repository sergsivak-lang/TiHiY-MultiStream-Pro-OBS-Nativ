name: Pull Request
run-name: ${{ github.event.pull_request.title }} pull request run 🚀
on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - '**.md'
    branches: [master, main]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true
jobs:
  check-format:
    name: Check Formatting 🔍
    uses: ./.github/workflows/check-format.yaml
    permissions:
      contents: read

  build-project:
    name: Build Project 🧱
    uses: ./.github/workflows/build-project.yaml
    secrets: inherit
    permissions:
      contents: read

  render-star-citizen-promo:
    name: Render three-source Star Citizen promo 🎬
    if: ${{ contains(github.event.pull_request.title, '[PROMO3]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Install tools and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl gawk
          sudo curl -fL --retry 5 --retry-delay 2 'https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp' -o /usr/local/bin/yt-dlp
          sudo chmod +x /usr/local/bin/yt-dlp
          mkdir -p work/fonts output
          curl -fL --retry 4 --retry-delay 2 'https://github.com/google/fonts/raw/main/ofl/orbitron/Orbitron%5Bwght%5D.ttf' -o work/fonts/Orbitron.ttf
          curl -fL --retry 4 --retry-delay 2 'https://github.com/google/fonts/raw/main/ofl/exo2/Exo2%5Bwght%5D.ttf' -o work/fonts/Exo2.ttf
          yt-dlp --version

      - name: Download the three official video sources
        shell: bash
        run: |
          set -euo pipefail
          cd work
          yt-dlp --no-playlist --retries 5 --fragment-retries 5 --concurrent-fragments 4 --merge-output-format mp4 -f 'bv*[height<=1440]+ba/b[height<=1440]' -o tactical.mp4 'https://www.youtube.com/watch?v=RWQSxN-ZukE'
          yt-dlp --no-playlist --retries 5 --fragment-retries 5 --concurrent-fragments 4 --merge-output-format mp4 -f 'bv*[height<=1440]+ba/b[height<=1440]' -o defensecon.mp4 'https://www.youtube.com/watch?v=BqPLaDMnUUs'
          curl -fL --retry 5 --retry-delay 3 'https://media.robertsspaceindustries.com/4tsoif8ccdaiq/source.mp4' -o foundation.mp4
          for F in tactical.mp4 defensecon.mp4 foundation.mp4; do
            ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of json "$F"
          done

      - name: Cut ten real moving scenes
        shell: bash
        run: |
          set -euo pipefail
          cd work

          make_clip() {
            SRC="$1"
            FRACTION="$2"
            OUT="$3"
            DUR=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$SRC")
            START=$(awk -v d="$DUR" -v f="$FRACTION" 'BEGIN{s=d*f; if(s+4.2>d)s=d-4.2; if(s<0)s=0; printf "%.3f",s}')
            echo "$OUT from $SRC at $START sec"
            ffmpeg -y -hide_banner -loglevel error -ss "$START" -i "$SRC" -t 4.1 -vf "scale=2560:1440:force_original_aspect_ratio=increase,crop=2560:1440,fps=60,eq=contrast=1.07:saturation=1.10:brightness=-0.008:gamma=0.99,unsharp=5:5:0.34,trim=duration=3.8,setpts=PTS-STARTPTS" -an -c:v libx264 -preset veryfast -crf 17 -profile:v high -pix_fmt yuv420p "$OUT"
          }

          make_clip tactical.mp4 0.12 clip0.mp4
          make_clip defensecon.mp4 0.18 clip1.mp4
          make_clip tactical.mp4 0.29 clip2.mp4
          make_clip foundation.mp4 0.23 clip3.mp4
          make_clip defensecon.mp4 0.46 clip4.mp4
          make_clip tactical.mp4 0.47 clip5.mp4
          make_clip defensecon.mp4 0.72 clip6.mp4
          make_clip foundation.mp4 0.64 clip7.mp4
          make_clip tactical.mp4 0.67 clip8.mp4
          make_clip tactical.mp4 0.83 clip9.mp4

      - name: Build continuous cinematic audio bed
        shell: bash
        run: |
          set -euo pipefail
          cd work
          ffmpeg -y -hide_banner -loglevel error -ss 2.0 -i tactical.mp4 -t 35.5 -vn -af "highpass=f=30,lowpass=f=18000,loudnorm=I=-14:LRA=8:TP=-1.2,afade=t=in:st=0:d=0.5,afade=t=out:st=34.5:d=1.0" -c:a aac -b:a 320k -ar 48000 -ac 2 audio.m4a

      - name: Render cinematic three-source promo
        shell: bash
        run: |
          set -euo pipefail
          cd work
          FILTER="[0:v][1:v]xfade=transition=smoothleft:duration=0.28:offset=3.52[v1];[v1][2:v]xfade=transition=zoomin:duration=0.28:offset=7.04[v2];[v2][3:v]xfade=transition=radial:duration=0.28:offset=10.56[v3];[v3][4:v]xfade=transition=hblur:duration=0.28:offset=14.08[v4];[v4][5:v]xfade=transition=fadeblack:duration=0.28:offset=17.60[v5];[v5][6:v]xfade=transition=circleopen:duration=0.28:offset=21.12[v6];[v6][7:v]xfade=transition=wipeleft:duration=0.28:offset=24.64[v7];[v7][8:v]xfade=transition=dissolve:duration=0.28:offset=28.16[v8];[v8][9:v]xfade=transition=smoothup:duration=0.28:offset=31.68[vbase];[vbase]vignette=PI/7,drawtext=fontfile=fonts/Orbitron.ttf:text='STAR CITIZEN':fontcolor=white:fontsize=150:borderw=4:bordercolor=black@0.88:shadowx=8:shadowy=8:shadowcolor=black@0.82:x=(w-text_w)/2:y=h*0.42:enable='between(t,0.25,3.45)':alpha='if(lt(t,0.78),(t-0.25)/0.53,if(lt(t,2.85),1,(3.45-t)/0.60))',drawtext=fontfile=fonts/Exo2.ttf:text='TiHiY-DED':fontcolor=white:fontsize=136:borderw=4:bordercolor=black@0.90:shadowx=8:shadowy=8:shadowcolor=black@0.84:x=(w-text_w)/2:y=h*0.44:enable='between(t,31.55,35.20)':alpha='if(lt(t,32.10),(t-31.55)/0.55,if(lt(t,34.55),1,(35.20-t)/0.65))',fade=t=in:st=0:d=0.18,fade=t=out:st=35.05:d=0.40[vout];[10:a]atrim=duration=35.48,asetpts=PTS-STARTPTS,alimiter=limit=0.95[aout]"
          ffmpeg -y -hide_banner -loglevel error -i clip0.mp4 -i clip1.mp4 -i clip2.mp4 -i clip3.mp4 -i clip4.mp4 -i clip5.mp4 -i clip6.mp4 -i clip7.mp4 -i clip8.mp4 -i clip9.mp4 -i audio.m4a -filter_complex "$FILTER" -map '[vout]' -map '[aout]' -c:v libx264 -preset medium -crf 16 -profile:v high -level 5.2 -pix_fmt yuv420p -c:a aac -b:a 320k -ar 48000 -ac 2 -movflags +faststart ../output/TiHiY_STAR_CITIZEN_TACTICAL_DEFENSECON_FOUNDATION_PROMO_2K_60FPS.mp4
          ffmpeg -y -hide_banner -loglevel error -i ../output/TiHiY_STAR_CITIZEN_TACTICAL_DEFENSECON_FOUNDATION_PROMO_2K_60FPS.mp4 -vf 'scale=1920:1080:flags=lanczos' -c:v libx264 -preset medium -crf 19 -profile:v high -pix_fmt yuv420p -c:a copy -movflags +faststart ../output/TiHiY_STAR_CITIZEN_TACTICAL_DEFENSECON_FOUNDATION_PROMO_1080p_60FPS.mp4
          ffmpeg -y -hide_banner -loglevel error -ss 1.2 -i ../output/TiHiY_STAR_CITIZEN_TACTICAL_DEFENSECON_FOUNDATION_PROMO_2K_60FPS.mp4 -frames:v 1 ../output/PREVIEW_START.jpg
          ffmpeg -y -hide_banner -loglevel error -ss 17.8 -i ../output/TiHiY_STAR_CITIZEN_TACTICAL_DEFENSECON_FOUNDATION_PROMO_2K_60FPS.mp4 -frames:v 1 ../output/PREVIEW_MIDDLE.jpg
          ffmpeg -y -hide_banner -loglevel error -ss 33.2 -i ../output/TiHiY_STAR_CITIZEN_TACTICAL_DEFENSECON_FOUNDATION_PROMO_2K_60FPS.mp4 -frames:v 1 ../output/PREVIEW_END.jpg
          ffprobe -v error -show_entries format=duration,size:stream=codec_name,width,height,r_frame_rate -of json ../output/TiHiY_STAR_CITIZEN_TACTICAL_DEFENSECON_FOUNDATION_PROMO_2K_60FPS.mp4

      - name: Upload finished three-source promo
        uses: actions/upload-artifact@v4
        with:
          name: TiHiY-Star-Citizen-Three-Source-Promo
          path: output/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
