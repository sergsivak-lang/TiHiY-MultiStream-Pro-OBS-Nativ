name: Pull Request
run-name: ${{ github.event.pull_request.title }} pull request run 🚀
on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - '**.md'
    branches: [master, main]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true
jobs:
  check-format:
    name: Check Formatting 🔍
    uses: ./.github/workflows/check-format.yaml
    permissions:
      contents: read

  build-project:
    name: Build Project 🧱
    uses: ./.github/workflows/build-project.yaml
    secrets: inherit
    permissions:
      contents: read

  scan-clean-star-citizen-sources:
    name: Scan clean Star Citizen source footage 🎞️
    if: ${{ contains(github.event.pull_request.title, '[SCANPROMO]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl
          mkdir -p work output

      - name: Download official RSI sources
        shell: bash
        run: |
          set -euo pipefail
          cd work
          curl -fL --retry 8 --retry-delay 3 --continue-at - 'https://media.robertsspaceindustries.com/in35u0wsdl5ys/source.mp4' -o tactical.mp4
          curl -fL --retry 8 --retry-delay 3 --continue-at - 'https://media.robertsspaceindustries.com/ek2roy7yuiw58/source.mp4' -o defensecon.mp4
          curl -fL --retry 8 --retry-delay 3 --continue-at - 'https://media.robertsspaceindustries.com/4tsoif8ccdaiq/source.mp4' -o foundation.mp4
          for F in tactical.mp4 defensecon.mp4 foundation.mp4; do
            ffprobe -v error -show_entries format=duration,size:stream=codec_type,codec_name,width,height -of json "$F" > "../output/${F%.mp4}_info.json"
          done

      - name: Make timestamped contact sheets
        shell: bash
        run: |
          set -euo pipefail
          cd work
          FONT='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          for F in tactical defensecon foundation; do
            ffmpeg -y -hide_banner -loglevel error -i "${F}.mp4" \
              -vf "fps=1/3,scale=480:-2,drawtext=fontfile=${FONT}:text='%{pts\\:hms}':x=10:y=10:fontsize=22:fontcolor=white:borderw=2:bordercolor=black,tile=4x4:padding=4:margin=4" \
              -q:v 2 -vsync vfr "../output/${F}_sheet_%02d.jpg"
          done

      - name: Upload source scan
        uses: actions/upload-artifact@v4
        with:
          name: TiHiY-Star-Citizen-Clean-Source-Scan
          path: output/*
          if-no-files-found: error
          compression-level: 6
          retention-days: 7

  render-clean-star-citizen-promo:
    name: Render clean Star Citizen music promo 🎬
    if: ${{ contains(github.event.pull_request.title, '[CLEANPROMO]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl
          mkdir -p work output

      - name: Download official RSI sources
        shell: bash
        run: |
          set -euo pipefail
          cd work
          curl -fL --retry 8 --retry-delay 3 --continue-at - 'https://media.robertsspaceindustries.com/in35u0wsdl5ys/source.mp4' -o tactical.mp4
          curl -fL --retry 8 --retry-delay 3 --continue-at - 'https://media.robertsspaceindustries.com/ek2roy7yuiw58/source.mp4' -o defensecon.mp4
          curl -fL --retry 8 --retry-delay 3 --continue-at - 'https://media.robertsspaceindustries.com/4tsoif8ccdaiq/source.mp4' -o foundation.mp4

      - name: Cut clean motion scenes
        shell: bash
        run: |
          set -euo pipefail
          cd work
          make_clip() {
            SRC="$1"; START="$2"; LEN="$3"; OUT="$4"
            ffmpeg -y -hide_banner -loglevel error -ss "$START" -i "$SRC" -t "$LEN" -an \
              -vf "scale=2560:1440:force_original_aspect_ratio=increase,crop=2560:1440,fps=60,eq=contrast=1.06:saturation=1.10:brightness=-0.008:gamma=0.99,unsharp=5:5:0.32" \
              -c:v libx264 -preset veryfast -crf 17 -profile:v high -pix_fmt yuv420p "$OUT"
          }
          # Placeholder clean ranges; refined after source scan.
          make_clip tactical.mp4 8.0 3.8 clip0.mp4
          make_clip defensecon.mp4 12.0 3.8 clip1.mp4
          make_clip tactical.mp4 23.0 3.8 clip2.mp4
          make_clip foundation.mp4 7.0 3.8 clip3.mp4
          make_clip defensecon.mp4 32.0 3.8 clip4.mp4
          make_clip tactical.mp4 45.0 3.8 clip5.mp4
          make_clip defensecon.mp4 52.0 3.8 clip6.mp4
          make_clip tactical.mp4 64.0 3.8 clip7.mp4

      - name: Build clean edit and use trailer music only
        shell: bash
        run: |
          set -euo pipefail
          cd work
          FILTER="[0:v][1:v]xfade=transition=smoothleft:duration=0.22:offset=3.58[v1];[v1][2:v]xfade=transition=fadeblack:duration=0.22:offset=7.16[v2];[v2][3:v]xfade=transition=zoomin:duration=0.22:offset=10.74[v3];[v3][4:v]xfade=transition=radial:duration=0.22:offset=14.32[v4];[v4][5:v]xfade=transition=smoothup:duration=0.22:offset=17.90[v5];[v5][6:v]xfade=transition=fade:duration=0.22:offset=21.48[v6];[v6][7:v]xfade=transition=wipeleft:duration=0.22:offset=25.06,vignette=PI/8,fade=t=in:st=0:d=0.18,fade=t=out:st=28.3:d=0.45[vout]"
          ffmpeg -y -hide_banner -loglevel error \
            -i clip0.mp4 -i clip1.mp4 -i clip2.mp4 -i clip3.mp4 -i clip4.mp4 -i clip5.mp4 -i clip6.mp4 -i clip7.mp4 \
            -filter_complex "$FILTER" -map '[vout]' \
            -c:v libx264 -preset medium -crf 16 -profile:v high -level 5.2 -pix_fmt yuv420p -an clean_video.mp4

          AUDIO=''
          for F in tactical.mp4 defensecon.mp4; do
            if ffprobe -v error -select_streams a:0 -show_entries stream=index -of csv=p=0 "$F" | grep -q .; then AUDIO="$F"; break; fi
          done
          if [ -n "$AUDIO" ]; then
            ffmpeg -y -hide_banner -loglevel error -ss 5 -i "$AUDIO" -t 28.7 -vn \
              -af "highpass=f=28,lowpass=f=18000,loudnorm=I=-13:LRA=7:TP=-1.0,afade=t=in:st=0:d=0.35,afade=t=out:st=27.8:d=0.9" \
              -c:a aac -b:a 320k -ar 48000 -ac 2 music.m4a
          else
            ffmpeg -y -hide_banner -loglevel error -f lavfi -i 'sine=frequency=52:sample_rate=48000:duration=28.7' -f lavfi -i 'anoisesrc=color=pink:sample_rate=48000:duration=28.7:amplitude=0.045' \
              -filter_complex "[0:a]volume=0.28,tremolo=f=0.18:d=0.62,aecho=0.8:0.5:110|220:0.20|0.10[low];[1:a]highpass=f=45,lowpass=f=1800,volume=0.16[noise];[low][noise]amix=inputs=2:normalize=0,afade=t=in:st=0:d=0.5,afade=t=out:st=27.8:d=0.9,alimiter=limit=0.94[a]" \
              -map '[a]' -c:a aac -b:a 320k -ar 48000 -ac 2 music.m4a
          fi

          ffmpeg -y -hide_banner -loglevel error -i clean_video.mp4 -i music.m4a -map 0:v:0 -map 1:a:0 -c:v copy -c:a copy -shortest -movflags +faststart ../output/TiHiY_STAR_CITIZEN_CLEAN_MUSIC_PROMO_2K_60FPS.mp4
          ffmpeg -y -hide_banner -loglevel error -i ../output/TiHiY_STAR_CITIZEN_CLEAN_MUSIC_PROMO_2K_60FPS.mp4 -vf 'scale=1920:1080:flags=lanczos' -c:v libx264 -preset medium -crf 19 -pix_fmt yuv420p -c:a copy -movflags +faststart ../output/TiHiY_STAR_CITIZEN_CLEAN_MUSIC_PROMO_1080p_60FPS.mp4

      - name: Upload clean music-only promo
        uses: actions/upload-artifact@v4
        with:
          name: TiHiY-Star-Citizen-Clean-Music-Promo
          path: output/*.mp4
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
