name: Build full-motion Star Citizen promo

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/build-star-citizen-promo.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Install tools and font
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl python3
          mkdir -p work output
          curl -fL --retry 4 'https://github.com/google/fonts/raw/main/ofl/orbitron/Orbitron%5Bwght%5D.ttf' -o work/Orbitron.ttf

      - name: Download official RSI moving video
        run: |
          curl -fL --retry 5 --retry-delay 3 \
            'https://media.robertsspaceindustries.com/4tsoif8ccdaiq/source.mp4' \
            -o work/source.mp4
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 work/source.mp4

      - name: Cut real moving scenes
        shell: bash
        run: |
          set -euo pipefail
          cd work
          DUR=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 source.mp4)
          for spec in '0 0.03' '1 0.18' '2 0.34' '3 0.50' '4 0.67' '5 0.83'; do
            read -r N F <<< "$spec"
            START=$(python3 - "$DUR" "$F" <<'PY'
import sys
d=float(sys.argv[1]); f=float(sys.argv[2]); clip=5.4
s=max(0,d*f)
if s+clip>d: s=max(0,d-clip-0.1)
print(f'{s:.3f}')
PY
)
            ffmpeg -y -hide_banner -loglevel error -ss "$START" -i source.mp4 -t 5.35 \
              -filter_complex "[0:v]scale=2560:1440:force_original_aspect_ratio=increase,crop=2560:1440,fps=60,eq=contrast=1.08:saturation=1.13:brightness=-0.01,unsharp=5:5:0.4,trim=duration=5,setpts=PTS-STARTPTS[v];[0:a]atrim=duration=5,asetpts=PTS-STARTPTS,loudnorm=I=-15:LRA=9:TP=-1.5[a]" \
              -map '[v]' -map '[a]' -c:v libx264 -preset medium -crf 16 -pix_fmt yuv420p \
              -c:a aac -b:a 256k -ar 48000 -ac 2 "clip${N}.mp4"
          done

      - name: Render cinematic transitions and titles
        shell: bash
        run: |
          set -euo pipefail
          cd work
          cat > fx.txt <<'EOF'
[0:v][1:v]xfade=transition=smoothleft:duration=0.5:offset=4.5[v1];
[v1][2:v]xfade=transition=zoomin:duration=0.5:offset=9.0[v2];
[v2][3:v]xfade=transition=radial:duration=0.5:offset=13.5[v3];
[v3][4:v]xfade=transition=smoothup:duration=0.5:offset=18.0[v4];
[v4][5:v]xfade=transition=fadeblack:duration=0.5:offset=22.5[vbase];
[0:a][1:a]acrossfade=d=0.5[a1];[a1][2:a]acrossfade=d=0.5[a2];[a2][3:a]acrossfade=d=0.5[a3];[a3][4:a]acrossfade=d=0.5[a4];[a4][5:a]acrossfade=d=0.5[abase];
[vbase]vignette=PI/6,drawtext=fontfile=Orbitron.ttf:text='STAR CITIZEN':fontcolor=white:fontsize=150:borderw=4:bordercolor=black@0.85:shadowx=8:shadowy=8:x=(w-text_w)/2:y=h*0.42:enable='between(t,0.35,3.8)':alpha='if(lt(t,0.9),(t-0.35)/0.55,if(lt(t,3.1),1,(3.8-t)/0.7))',drawtext=fontfile=Orbitron.ttf:text='TiHiY-DED':fontcolor=white:fontsize=128:borderw=4:bordercolor=black@0.9:shadowx=8:shadowy=8:x=(w-text_w)/2:y=h*0.44:enable='between(t,23.1,27.4)':alpha='if(lt(t,23.7),(t-23.1)/0.6,if(lt(t,26.7),1,(27.4-t)/0.7))',fade=t=in:st=0:d=0.2,fade=t=out:st=27.0:d=0.5[vout];
[abase]afade=t=in:st=0:d=0.25,afade=t=out:st=26.8:d=0.7,alimiter=limit=0.95[aout]
EOF
          ffmpeg -y -hide_banner -loglevel error \
            -i clip0.mp4 -i clip1.mp4 -i clip2.mp4 -i clip3.mp4 -i clip4.mp4 -i clip5.mp4 \
            -filter_complex_script fx.txt -map '[vout]' -map '[aout]' \
            -c:v libx264 -preset slow -crf 16 -profile:v high -level 5.2 -pix_fmt yuv420p \
            -c:a aac -b:a 320k -movflags +faststart \
            ../output/TiHiY_STAR_CITIZEN_FULL_MOTION_PROMO_2K_60FPS.mp4
          ffmpeg -y -hide_banner -loglevel error \
            -i ../output/TiHiY_STAR_CITIZEN_FULL_MOTION_PROMO_2K_60FPS.mp4 \
            -vf scale=1920:1080:flags=lanczos -c:v libx264 -preset medium -crf 19 \
            -pix_fmt yuv420p -c:a copy -movflags +faststart \
            ../output/TiHiY_STAR_CITIZEN_FULL_MOTION_PROMO_1080p_60FPS.mp4
          ffprobe -v error -show_entries format=duration,size:stream=width,height,r_frame_rate -of json ../output/TiHiY_STAR_CITIZEN_FULL_MOTION_PROMO_2K_60FPS.mp4

      - name: Upload real video promo
        uses: actions/upload-artifact@v4
        with:
          name: TiHiY-Star-Citizen-Full-Motion-Promo
          path: output/*.mp4
          compression-level: 0
          retention-days: 7
