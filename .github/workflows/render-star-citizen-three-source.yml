name: Render Star Citizen three-source promo

on:
  pull_request_target:
    branches: [master]
    types: [opened, synchronize, reopened]
    paths:
      - promo-three-source-trigger.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Install render tools and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl gawk
          mkdir -p work/fonts output
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 'https://github.com/google/fonts/raw/main/ofl/orbitron/Orbitron%5Bwght%5D.ttf' -o work/fonts/Orbitron.ttf
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 'https://github.com/google/fonts/raw/main/ofl/exo2/Exo2%5Bwght%5D.ttf' -o work/fonts/Exo2.ttf

      - name: Download Tactical Strike DefenseCon and Foundation Festival
        shell: bash
        run: |
          set -euo pipefail
          cd work

          download_video() {
            URL="$1"
            FILE="$2"
            rm -f "$FILE"
            for ATTEMPT in 1 2 3 4; do
              echo "Downloading $FILE - attempt $ATTEMPT"
              if curl -fL --retry 10 --retry-all-errors --retry-delay 5 --connect-timeout 30 --max-time 900 --speed-time 45 --speed-limit 1024 "$URL" -o "$FILE"; then
                if ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=nw=1:nk=1 "$FILE" | grep -q .; then
                  return 0
                fi
              fi
              rm -f "$FILE"
              sleep 10
            done
            echo "Failed to download valid video: $FILE"
            return 1
          }

          download_video 'https://media.robertsspaceindustries.com/in35u0wsdl5ys/source.mp4' tactical.mp4
          download_video 'https://media.robertsspaceindustries.com/ek2roy7yuiw58/source.mp4' defensecon.mp4
          download_video 'https://media.robertsspaceindustries.com/4tsoif8ccdaiq/source.mp4' foundation.mp4

          for F in tactical.mp4 defensecon.mp4 foundation.mp4; do
            ffprobe -v error -show_entries format=duration,size:stream=codec_name,codec_type,width,height -of json "$F"
          done

      - name: Cut nine real moving sequences
        shell: bash
        run: |
          set -euo pipefail
          cd work

          make_clip() {
            SRC="$1"
            FRACTION="$2"
            OUT="$3"
            DUR=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$SRC")
            START=$(awk -v d="$DUR" -v f="$FRACTION" 'BEGIN{s=d*f; if(s+4.3>d)s=d-4.3; if(s<0)s=0; printf "%.3f",s}')
            echo "$OUT from $SRC at $START sec"
            ffmpeg -y -hide_banner -loglevel error -ss "$START" -i "$SRC" -t 4.2 -vf "scale=2560:1440:force_original_aspect_ratio=increase,crop=2560:1440,fps=60,eq=contrast=1.07:saturation=1.11:brightness=-0.008:gamma=0.99,unsharp=5:5:0.35,trim=duration=3.9,setpts=PTS-STARTPTS" -an -c:v libx264 -preset veryfast -crf 17 -profile:v high -pix_fmt yuv420p "$OUT"
          }

          make_clip tactical.mp4 0.08 clip0.mp4
          make_clip defensecon.mp4 0.14 clip1.mp4
          make_clip tactical.mp4 0.30 clip2.mp4
          make_clip foundation.mp4 0.18 clip3.mp4
          make_clip defensecon.mp4 0.46 clip4.mp4
          make_clip tactical.mp4 0.53 clip5.mp4
          make_clip defensecon.mp4 0.73 clip6.mp4
          make_clip foundation.mp4 0.67 clip7.mp4
          make_clip tactical.mp4 0.82 clip8.mp4

      - name: Build continuous cinematic audio
        shell: bash
        run: |
          set -euo pipefail
          cd work
          AUDIO_SRC=''
          for F in tactical.mp4 defensecon.mp4 foundation.mp4; do
            if ffprobe -v error -select_streams a:0 -show_entries stream=index -of csv=p=0 "$F" | grep -q .; then
              AUDIO_SRC="$F"
              break
            fi
          done

          if [ -n "$AUDIO_SRC" ]; then
            echo "Using official audio from $AUDIO_SRC"
            ffmpeg -y -hide_banner -loglevel error -stream_loop -1 -ss 1.0 -i "$AUDIO_SRC" -t 33.0 -vn -af "highpass=f=30,lowpass=f=18000,loudnorm=I=-14:LRA=8:TP=-1.2,afade=t=in:st=0:d=0.5,afade=t=out:st=32.0:d=1.0" -c:a aac -b:a 320k -ar 48000 -ac 2 audio.m4a
          else
            echo 'Official sources are silent; creating cinematic sci-fi sound design.'
            ffmpeg -y -hide_banner -loglevel error -f lavfi -i 'sine=frequency=46:sample_rate=48000:duration=33' -f lavfi -i 'sine=frequency=92:sample_rate=48000:duration=33' -f lavfi -i 'anoisesrc=color=pink:sample_rate=48000:duration=33:amplitude=0.06' -filter_complex "[0:a]volume=0.30,tremolo=f=0.15:d=0.70,aecho=0.8:0.55:110|220:0.24|0.11[low];[1:a]volume=0.09,tremolo=f=0.30:d=0.58[high];[2:a]highpass=f=40,lowpass=f=1500,volume=0.18[noise];[low][high][noise]amix=inputs=3:duration=first:normalize=0,afade=t=in:st=0:d=0.8,afade=t=out:st=32:d=1.0,alimiter=limit=0.94,pan=stereo|c0=c0|c1=c0[out]" -map '[out]' -c:a aac -b:a 320k -ar 48000 -ac 2 audio.m4a
          fi

      - name: Render cinematic channel promo
        shell: bash
        run: |
          set -euo pipefail
          cd work
          FILTER="[0:v][1:v]xfade=transition=smoothleft:duration=0.30:offset=3.60[v1];[v1][2:v]xfade=transition=zoomin:duration=0.30:offset=7.20[v2];[v2][3:v]xfade=transition=radial:duration=0.30:offset=10.80[v3];[v3][4:v]xfade=transition=hblur:duration=0.30:offset=14.40[v4];[v4][5:v]xfade=transition=fadeblack:duration=0.30:offset=18.00[v5];[v5][6:v]xfade=transition=circleopen:duration=0.30:offset=21.60[v6];[v6][7:v]xfade=transition=dissolve:duration=0.30:offset=25.20[v7];[v7][8:v]xfade=transition=smoothup:duration=0.30:offset=28.80[vbase];[vbase]vignette=PI/7,drawtext=fontfile=fonts/Orbitron.ttf:text='STAR CITIZEN':fontcolor=white:fontsize=150:borderw=4:bordercolor=black@0.88:shadowx=8:shadowy=8:shadowcolor=black@0.82:x=(w-text_w)/2:y=h*0.42:enable='between(t,0.25,3.50)':alpha='if(lt(t,0.80),(t-0.25)/0.55,if(lt(t,2.90),1,(3.50-t)/0.60))',drawtext=fontfile=fonts/Exo2.ttf:text='TiHiY-DED':fontcolor=white:fontsize=138:borderw=4:bordercolor=black@0.90:shadowx=8:shadowy=8:shadowcolor=black@0.84:x=(w-text_w)/2:y=h*0.44:enable='between(t,29.00,32.35)':alpha='if(lt(t,29.55),(t-29.00)/0.55,if(lt(t,31.70),1,(32.35-t)/0.65))',fade=t=in:st=0:d=0.18,fade=t=out:st=32.20:d=0.40[vout];[9:a]atrim=duration=32.40,asetpts=PTS-STARTPTS,alimiter=limit=0.95[aout]"

          ffmpeg -y -hide_banner -loglevel error -i clip0.mp4 -i clip1.mp4 -i clip2.mp4 -i clip3.mp4 -i clip4.mp4 -i clip5.mp4 -i clip6.mp4 -i clip7.mp4 -i clip8.mp4 -i audio.m4a -filter_complex "$FILTER" -map '[vout]' -map '[aout]' -c:v libx264 -preset medium -crf 16 -profile:v high -level 5.2 -pix_fmt yuv420p -c:a aac -b:a 320k -ar 48000 -ac 2 -movflags +faststart ../output/TiHiY_STAR_CITIZEN_TACTICAL_DEFENSECON_FOUNDATION_PROMO_2K_60FPS.mp4

          ffmpeg -y -hide_banner -loglevel error -i ../output/TiHiY_STAR_CITIZEN_TACTICAL_DEFENSECON_FOUNDATION_PROMO_2K_60FPS.mp4 -vf 'scale=1920:1080:flags=lanczos' -c:v libx264 -preset medium -crf 19 -profile:v high -pix_fmt yuv420p -c:a copy -movflags +faststart ../output/TiHiY_STAR_CITIZEN_TACTICAL_DEFENSECON_FOUNDATION_PROMO_1080p_60FPS.mp4

          ffmpeg -y -hide_banner -loglevel error -ss 1.2 -i ../output/TiHiY_STAR_CITIZEN_TACTICAL_DEFENSECON_FOUNDATION_PROMO_2K_60FPS.mp4 -frames:v 1 ../output/PREVIEW_START.jpg
          ffmpeg -y -hide_banner -loglevel error -ss 16.0 -i ../output/TiHiY_STAR_CITIZEN_TACTICAL_DEFENSECON_FOUNDATION_PROMO_2K_60FPS.mp4 -frames:v 1 ../output/PREVIEW_MIDDLE.jpg
          ffmpeg -y -hide_banner -loglevel error -ss 30.5 -i ../output/TiHiY_STAR_CITIZEN_TACTICAL_DEFENSECON_FOUNDATION_PROMO_2K_60FPS.mp4 -frames:v 1 ../output/PREVIEW_END.jpg
          ffprobe -v error -show_entries format=duration,size:stream=codec_name,width,height,r_frame_rate -of json ../output/TiHiY_STAR_CITIZEN_TACTICAL_DEFENSECON_FOUNDATION_PROMO_2K_60FPS.mp4

      - name: Upload finished promo
        uses: actions/upload-artifact@v4
        with:
          name: TiHiY-Star-Citizen-Tactical-DefenseCon-Foundation-Promo
          path: output/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
