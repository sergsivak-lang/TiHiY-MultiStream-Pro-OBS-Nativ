name: Scan New Official Star Citizen Videos

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.title, '[NEWSCAN]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3 python3-pip curl
          python3 -m pip install -U yt-dlp
          mkdir -p work output

      - name: Read newest uploads from official Star Citizen channel RSS
        shell: bash
        run: |
          set -euo pipefail
          cd work
          CHANNEL_ID='UCTeLqJq1mXUX5WWoNXLmOIA'
          curl -fL --retry 5 --retry-delay 2 "https://www.youtube.com/feeds/videos.xml?channel_id=${CHANNEL_ID}" -o official_feed.xml
          cp official_feed.xml ../output/OFFICIAL_FEED.xml

          cat > select_latest.py <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          ns = {
              'atom':'http://www.w3.org/2005/Atom',
              'yt':'http://www.youtube.com/xml/schemas/2015'
          }
          root = ET.parse('official_feed.xml').getroot()
          rows=[]
          for e in root.findall('atom:entry', ns):
              title=(e.findtext('atom:title', default='', namespaces=ns) or '').strip()
              vid=(e.findtext('yt:videoId', default='', namespaces=ns) or '').strip()
              published=(e.findtext('atom:published', default='', namespaces=ns) or '').strip()
              rows.append((published,title,vid))
          Path('../output/FEED_LIST.txt').write_text('\n'.join(f'{d}|{t}|https://www.youtube.com/watch?v={v}' for d,t,v in rows))

          preferred=[]
          for row in rows:
              low=row[1].lower()
              if any(k in low for k in ['behind the ships','inside star citizen','alpha 4.9','frontier','foundation','star citizen |']):
                  preferred.append(row)
          chosen=(preferred+rows)[:6]
          seen=set(); final=[]
          for r in chosen:
              if r[2] and r[2] not in seen:
                  final.append(r); seen.add(r[2])
              if len(final)==4: break
          if len(final)<4:
              raise SystemExit('Official RSS did not contain four usable videos')
          Path('selected.txt').write_text('\n'.join(f'{i}|{d}|{t}|{v}' for i,(d,t,v) in enumerate(final)))
          Path('../output/SELECTED.txt').write_text(Path('selected.txt').read_text())
          PY
          python3 select_latest.py
          cat ../output/SELECTED.txt

      - name: Download selected newest official videos
        shell: bash
        run: |
          set -euo pipefail
          cd work
          while IFS='|' read -r IDX DATE TITLE VID; do
            URL="https://www.youtube.com/watch?v=${VID}"
            echo "Downloading official source ${IDX}: ${TITLE} (${DATE}) ${URL}"
            yt-dlp --no-playlist --ffmpeg-location /usr/bin \
              --extractor-args 'youtube:player_client=tv_embedded,web_safari' \
              -f 'bv*[height<=1440]+ba/b[height<=1440]' \
              --merge-output-format mp4 -o "new${IDX}.mp4" "$URL"
          done < selected.txt

      - name: Validate and make timestamped contact sheets
        shell: bash
        run: |
          set -euo pipefail
          cd work
          FONT='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          for IDX in 0 1 2 3; do
            F="new${IDX}"
            ffprobe -v error -show_entries format=duration,size:stream=codec_type,codec_name,width,height,r_frame_rate -of json "${F}.mp4" > "../output/${F}_info.json"
            ffmpeg -y -hide_banner -loglevel error -i "${F}.mp4" \
              -vf "fps=1/4,scale=480:-2,drawtext=fontfile=${FONT}:text='%{pts\\:hms}':x=8:y=8:fontsize=22:fontcolor=white:borderw=2:bordercolor=black,tile=4x4:padding=4:margin=4" \
              -q:v 2 -vsync vfr "../output/${F}_sheet_%02d.jpg"
          done

      - name: Upload scan
        uses: actions/upload-artifact@v4
        with:
          name: TiHiY-New-Official-Star-Citizen-Scan
          path: output/*
          if-no-files-found: error
          compression-level: 6
          retention-days: 7
