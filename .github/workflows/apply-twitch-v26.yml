name: Apply Twitch v2.6 patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        shell: pwsh
        run: ./tools/patch-twitch-v26.ps1

      - name: Configure Git
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit and push
        shell: pwsh
        run: |
          git add src/tihiy-multistream-dock.cpp tools/patch-twitch-v26.ps1 .github/workflows/apply-twitch-v26.yml
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No changes to commit."
            exit 0
          }
          git commit -m "Implement Twitch 2K and Dual Format runtime setup"
          git push origin HEAD:master
