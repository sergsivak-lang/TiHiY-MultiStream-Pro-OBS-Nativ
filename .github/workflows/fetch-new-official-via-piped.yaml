name: Fetch New Official Star Citizen Videos via Piped

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.title, '[PIPEDFETCH]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl python3
          mkdir -p work output

      - name: Resolve and download new official videos through Piped proxy streams
        shell: bash
        run: |
          set -euo pipefail
          cd work
          cat > fetch_piped.py <<'PY'
          import json, subprocess, pathlib, re

          videos={
              'basher':'whpBNeYsJQA',
              'patch49':'OX__JZULs-Y',
              'tyilui':'oulQmbwN87M',
              'railen':'Xh35kuWo0a4',
          }
          apis=[
              'https://pipedapi.kavin.rocks',
              'https://pipedapi.tokhmi.xyz',
              'https://pipedapi.moomoo.me',
              'https://pipedapi.syncpundit.io',
              'https://api-piped.mha.fi',
              'https://piped-api.garudalinux.org',
          ]

          def curl_json(url):
              p=subprocess.run(['curl','-fsSL','--retry','2','--connect-timeout','12','--max-time','45','-A','Mozilla/5.0',url],capture_output=True,text=True)
              if p.returncode: return None
              try:
                  d=json.loads(p.stdout)
                  return d if isinstance(d,dict) else None
              except Exception: return None

          def download(url,path,referer=''):
              cmd=['curl','-fL','--retry','6','--retry-delay','2','--connect-timeout','20','-A','Mozilla/5.0']
              if referer: cmd += ['-e',referer+'/']
              cmd += [url,'-o',path]
              subprocess.run(cmd,check=True)

          for name,vid in videos.items():
              data=None; api=None
              for base in apis:
                  d=curl_json(f'{base}/streams/{vid}')
                  if d and (d.get('videoStreams') or d.get('hls')):
                      data=d; api=base; break
              if not data:
                  raise SystemExit(f'No Piped API returned streams for {name} {vid}')
              pathlib.Path(f'../output/{name}_piped.json').write_text(json.dumps(data,indent=2))
              print(name,'resolved through',api,'title=',data.get('title'))

              vs=[]
              for s in data.get('videoStreams') or []:
                  u=s.get('url'); q=s.get('quality') or ''
                  if not u: continue
                  m=re.search(r'(\d{3,4})p',q); h=int(m.group(1)) if m else (s.get('height') or 0)
                  if h and h<=1440:
                      mime=(s.get('mimeType') or '').lower()
                      codec=(s.get('codec') or '').lower()
                      score=(1 if ('mp4' in mime or 'avc' in codec or 'h264' in codec) else 0,h,s.get('fps') or 0,s.get('bitrate') or 0)
                      vs.append((score,u,s))
              aud=[]
              for s in data.get('audioStreams') or []:
                  u=s.get('url')
                  if not u: continue
                  mime=(s.get('mimeType') or '').lower(); codec=(s.get('codec') or '').lower()
                  score=(1 if ('mp4' in mime or 'm4a' in mime or 'aac' in codec) else 0,s.get('bitrate') or 0)
                  aud.append((score,u,s))
              if not vs:
                  raise SystemExit(f'No usable <=1440p video stream for {name}')
              vs.sort(key=lambda x:x[0],reverse=True); vurl=vs[0][1]
              pathlib.Path(f'../output/{name}_video_selected.json').write_text(json.dumps(vs[0][2],indent=2))
              download(vurl,f'{name}_video.bin',api)

              if aud:
                  aud.sort(key=lambda x:x[0],reverse=True); aurl=aud[0][1]
                  pathlib.Path(f'../output/{name}_audio_selected.json').write_text(json.dumps(aud[0][2],indent=2))
                  download(aurl,f'{name}_audio.bin',api)
                  subprocess.run(['ffmpeg','-y','-hide_banner','-loglevel','error','-i',f'{name}_video.bin','-i',f'{name}_audio.bin','-map','0:v:0','-map','1:a:0','-c','copy',f'{name}.mp4'],check=True)
              else:
                  subprocess.run(['ffmpeg','-y','-hide_banner','-loglevel','error','-i',f'{name}_video.bin','-c','copy',f'{name}.mp4'],check=True)
              subprocess.run(['ffprobe','-v','error','-show_entries','format=duration,size:stream=codec_type,codec_name,width,height,r_frame_rate','-of','json',f'{name}.mp4'],stdout=open(f'../output/{name}_info.json','w'),check=True)
          PY
          python3 fetch_piped.py

      - name: Make timestamped contact sheets
        shell: bash
        run: |
          set -euo pipefail
          cd work
          FONT='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          for K in basher patch49 tyilui railen; do
            ffmpeg -y -hide_banner -loglevel error -i "${K}.mp4" \
              -vf "fps=1/3,scale=480:-2,drawtext=fontfile=${FONT}:text='%{pts\\:hms}':x=8:y=8:fontsize=22:fontcolor=white:borderw=2:bordercolor=black,tile=4x4:padding=4:margin=4" \
              -q:v 2 -vsync vfr "../output/${K}_sheet_%02d.jpg"
          done

      - name: Upload new official source scan
        uses: actions/upload-artifact@v4
        with:
          name: TiHiY-New-Official-Piped-Source-Scan
          path: output/*
          if-no-files-found: error
          compression-level: 6
          retention-days: 7
