name: Extract New RSI Video Assets

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.title, '[RSIASSET]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl python3 ffmpeg
          mkdir -p pages videos output

      - name: Fetch official RSI Comm-Link pages
        shell: bash
        run: |
          set -euo pipefail
          declare -A PAGES=(
            [basher]='https://robertsspaceindustries.com/en/comm-link/transmission/21247-Behind-The-Ships'
            [patch49]='https://robertsspaceindustries.com/en/comm-link/transmission/21228-Inside-Star-Citizen'
            [tyilui]='https://robertsspaceindustries.com/en/comm-link/transmission/21214-Behind-The-Ships'
            [railen]='https://robertsspaceindustries.com/en/comm-link/transmission/21207-Behind-The-Ships'
          )
          for K in basher patch49 tyilui railen; do
            URL="${PAGES[$K]}"
            curl -fL --compressed --retry 5 --retry-delay 2 \
              -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/150 Safari/537.36' \
              "$URL" -o "pages/${K}.html"
          done

      - name: Resolve direct RSI media containers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, html
          from pathlib import Path
          for p in Path('pages').glob('*.html'):
              s=html.unescape(p.read_text(errors='ignore')).replace('\\/','/')
              hashes=re.findall(r'media\.robertsspaceindustries\.com/([a-z0-9]+)/heap_thumb\.jpg',s,re.I)
              if not hashes:
                  raise SystemExit(f'No RSI media hash found for {p.stem}')
              h=hashes[0]
              Path(f'output/{p.stem}_direct_url.txt').write_text(f'https://media.robertsspaceindustries.com/{h}/source.mp4\n')
              print(p.stem,h)
          PY
          cat output/*_direct_url.txt

      - name: Download direct new RSI source videos
        shell: bash
        run: |
          set -euo pipefail
          for K in basher patch49 tyilui railen; do
            URL=$(cat "output/${K}_direct_url.txt")
            echo "Downloading ${K}: ${URL}"
            curl -fL --retry 8 --retry-delay 3 --continue-at - "$URL" -o "videos/${K}.mp4"
            ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,r_frame_rate -show_entries format=duration,size -of json "videos/${K}.mp4" > "output/${K}_info.json"
          done

      - name: Make timestamped visual contact sheets
        shell: bash
        run: |
          set -euo pipefail
          FONT='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          for K in basher patch49 tyilui railen; do
            ffmpeg -y -hide_banner -loglevel error -i "videos/${K}.mp4" \
              -vf "fps=1/3,scale=480:-2,drawtext=fontfile=${FONT}:text='%{pts\\:hms}':x=8:y=8:fontsize=22:fontcolor=white:borderw=2:bordercolor=black,tile=4x4:padding=4:margin=4" \
              -q:v 2 -vsync vfr "output/${K}_sheet_%02d.jpg"
          done

      - name: Upload direct-source scan
        uses: actions/upload-artifact@v4
        with:
          name: TiHiY-New-RSI-Direct-Source-Scan
          path: output/*
          if-no-files-found: error
          compression-level: 6
          retention-days: 7
